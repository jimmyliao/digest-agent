# Cloud Build config for the Next.js apps/web image.
#
# Why this exists: `gcloud run deploy --source apps/web/` would limit the
# build context to apps/web/, but the Dockerfile needs paths from repo root
# (infra/ for litestream config, packages/ for the @leapcore/iface workspace
# dependency). This config builds with the **repo root** as context and
# explicitly points at apps/web/Dockerfile.
#
# Substitutions:
#   _IMAGE  required, e.g. us-central1-docker.pkg.dev/PROJECT/REPO/digest-agent-web:TAG

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - '${_IMAGE}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
